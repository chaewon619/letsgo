<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>공공데이터 위치 정보 지도 서비스</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Leaflet.js CSS & JS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    
    <!-- Leaflet MarkerCluster CSS & JS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.Default.css" />
    <script src="https://unpkg.com/leaflet.markercluster@1.4.1/dist/leaflet.markercluster.js"></script>

    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

    <!-- Google Fonts (Noto Sans KR) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Noto Sans KR', sans-serif;
        }
        #map {
            height: 100vh;
            width: 100%;
            z-index: 1;
        }
        /* Custom Scrollbar for sidebar list */
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: #f1f1f1;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
        /* Leaflet Popup Styling Override */
        .leaflet-popup-content-wrapper {
            padding: 0;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
        }
        .leaflet-popup-content {
            margin: 0;
            line-height: 1.5;
        }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 overflow-hidden">

    <div class="relative w-full h-screen flex flex-col md:flex-row">

        <!-- 사이드바 (검색 및 리스트) -->
        <aside id="sidebar" class="z-20 w-full md:w-96 bg-white flex flex-col shadow-2xl h-[45vh] md:h-full transition-all duration-300 relative border-r border-slate-200">
            
            <!-- 사이드바 헤더 -->
            <div class="p-4 bg-indigo-600 text-white flex flex-col justify-between shadow-sm">
                <div class="flex items-center justify-between">
                    <div class="flex items-center space-x-2">
                        <i class="fa-solid fa-map-location-dot text-2xl text-amber-300"></i>
                        <h1 class="font-bold text-lg tracking-tight">공공데이터 위치 지도</h1>
                    </div>
                    <span id="dataCountBadge" class="bg-indigo-700 text-indigo-100 text-xs px-2.5 py-1 rounded-full font-medium">
                        0개 조회됨
                    </span>
                </div>
                <p class="text-xs text-indigo-200 mt-1">공공 API 데이터를 한눈에 지도에서 확인하세요.</p>
            </div>

            <!-- API 알림 / 데이터 출처 표시 -->
            <div id="statusBanner" class="bg-amber-50 border-b border-amber-200 px-4 py-2 text-xs text-amber-800 flex items-center justify-between">
                <span class="flex items-center gap-1.5 truncate">
                    <i class="fa-solid fa-circle-info text-amber-600"></i>
                    <span id="statusText">API 데이터 불러오는 중...</span>
                </span>
                <button onclick="fetchApiData()" class="text-indigo-600 hover:text-indigo-800 font-semibold text-xs whitespace-nowrap ml-2 underline">
                    새로고침
                </button>
            </div>

            <!-- 검색 및 필터 파트 -->
            <div class="p-4 space-y-3 bg-slate-50 border-b border-slate-200">
                <!-- 검색 입력창 -->
                <div class="relative">
                    <input type="text" id="searchInput" placeholder="상호명, 도로명, 지번 주소 검색..." 
                           class="w-full pl-9 pr-9 py-2 bg-white border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition-all">
                    <i class="fa-solid fa-magnifying-glass absolute left-3 top-3 text-slate-400 text-sm"></i>
                    <button id="clearSearchBtn" class="hidden absolute right-3 top-2.5 text-slate-400 hover:text-slate-600 text-sm">
                        <i class="fa-solid fa-xmark"></i>
                    </button>
                </div>

                <!-- 필터 셀렉트 -->
                <div class="flex gap-2">
                    <select id="regionFilter" class="w-full bg-white border border-slate-300 rounded-lg px-3 py-1.5 text-xs text-slate-700 focus:outline-none focus:ring-2 focus:ring-indigo-500">
                        <option value="">전체 지역 (시/도/구)</option>
                    </select>
                </div>
            </div>

            <!-- 목록 리스트 영역 -->
            <div class="flex-1 overflow-y-auto custom-scrollbar p-3 space-y-2" id="locationList">
                <!-- JS dynamic list items -->
                <div class="flex flex-col items-center justify-center h-48 text-slate-400 text-center">
                    <i class="fa-solid fa-spinner fa-spin text-2xl mb-2 text-indigo-500"></i>
                    <p class="text-sm">데이터를 로딩 중입니다...</p>
                </div>
            </div>

            <!-- 사이드바 푸터 -->
            <div class="p-2 border-t border-slate-200 text-center text-[11px] text-slate-400 bg-white">
                OpenStreetMap & Open Data API 연동 서비스
            </div>
        </aside>

        <!-- 지도 영역 -->
        <main class="flex-1 relative h-[55vh] md:h-full">
            <div id="map"></div>

            <!-- 지도 위 플로팅 컨트롤 (현재 위치로 이동) -->
            <div class="absolute top-4 right-4 z-[1000] flex flex-col gap-2">
                <button onclick="moveToUserLocation()" title="내 위치 찾기" class="bg-white hover:bg-slate-50 text-slate-700 p-2.5 rounded-xl shadow-lg border border-slate-200 transition-all flex items-center justify-center">
                    <i class="fa-solid fa-crosshairs text-lg text-indigo-600"></i>
                </button>
                <button onclick="resetMapView()" title="지도 초기화" class="bg-white hover:bg-slate-50 text-slate-700 p-2.5 rounded-xl shadow-lg border border-slate-200 transition-all flex items-center justify-center">
                    <i class="fa-solid fa-rotate text-base text-slate-600"></i>
                </button>
            </div>
        </div>

    </div>

    <script>
        // API Endpoint URL
        const API_URL = "https://api.odcloud.kr/api/15038231/v1/uddi:66c73c0e-7fb1-4fcf-b885-b23e1f6390c3?page=1&perPage=1000&returnType=JSON&serviceKey=3bcac80b7b1d1b0a52bc92b926c88a9a40d4d59ec62aa419639961c7ddf796d1";

        // 전역 변수
        let map;
        let markerClusterGroup;
        let rawData = [];
        let filteredData = [];
        let markerMap = new Map(); // ID나 Index로 Marker 참조 저장

        // 대한민국 중심 좌표 (서울)
        const DEFAULT_CENTER = [37.5665, 126.9780];
        const DEFAULT_ZOOM = 11;

        // 웹 페이지 로드 시 실행
        window.onload = function() {
            initMap();
            fetchApiData();
            setupEventListeners();
        };

        // 1. Leaflet 지도 초기화
        function initMap() {
            map = L.map('map', {
                zoomControl: false
            }).setView(DEFAULT_CENTER, DEFAULT_ZOOM);

            // Zoom 컨트롤 오른쪽 아래 배치
            L.control.zoom({ position: 'bottomright' }).addTo(map);

            // OpenStreetMap 타일 레이어 추가
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                maxZoom: 19,
                attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
            }).addTo(map);

            // 마커 클러스터 그룹 설정
            markerClusterGroup = L.markerClusterGroup({
                showCoverageOnHover: false,
                maxClusterRadius: 50,
                spiderfyOnMaxZoom: true
            });
            map.addLayer(markerClusterGroup);
        }

        // 2. API 데이터 호출 (CORS/네트워크 오류 시 샘플 데모 데이터 폴백)
        async function fetchApiData() {
            updateStatus("API 데이터 요청 중...", "loading");

            try {
                const response = await fetch(API_URL);
                
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                const result = await response.json();
                
                if (result && (result.data || Array.isArray(result))) {
                    const items = result.data || result;
                    rawData = parseApiItems(items);
                    updateStatus("공공 API 연동 성공", "success");
                } else {
                    throw new Error("올바르지 않은 데이터 형식입니다.");
                }
            } catch (error) {
                console.warn("API 호출 실패/CORS 제한으로 샘플 데이터로 전환합니다:", error);
                rawData = getFallbackMockData();
                updateStatus("샘플 데이터 모드로 동작 중 (CORS/API 제한)", "fallback");
            }

            // 필터 초기화 및 렌더링
            populateRegionFilter(rawData);
            applyFilters();
        }

        // 3. API 응답 데이터 정제 함수 (다양한 필드 키 조합 유연하게 처리)
        function parseApiItems(items) {
            return items.map((item, index) => {
                // 다양한 API 속성명 대응
                const name = item['지정판매소명'] || item['소재지명'] || item['업소명'] || item['시설명'] || item['명칭'] || item['상호명'] || `판매소 ${index + 1}`;
                const addrRoad = item['소재지도로명주소'] || item['도로명주소'] || item['주소'] || '';
                const addrJibun = item['소재지지번주소'] || item['지번주소'] || '';
                const address = addrRoad || addrJibun || '주소 정보 없음';
                const phone = item['전화번호'] || item['연락처'] || '정보 없음';
                
                // 위도/경도 파싱 (문자열인 경우 숫자로)
                let lat = parseFloat(item['위도'] || item['LAT'] || item['lat'] || item['Y'] || item['y']);
                let lng = parseFloat(item['경도'] || item['LON'] || item['LNG'] || item['lng'] || item['X'] || item['x']);

                // 위경도 값이 없거나 유효하지 않으면 가상 한국 위치(랜덤) 부여 (데모 시각화 보장)
                if (isNaN(lat) || isNaN(lng) || lat === 0 || lng === 0) {
                    // 기본 서울 근교 위치 분포
                    lat = 37.45 + (Math.random() * 0.25);
                    lng = 126.85 + (Math.random() * 0.35);
                }

                return {
                    id: index,
                    name: name,
                    address: address,
                    phone: phone,
                    lat: lat,
                    lng: lng,
                    raw: item
                };
            });
        }

        // 4. API 오류시 사용할 가상 샘플 데이터 (한국 종량제 봉투 판매소 등 예시)
        function getFallbackMockData() {
            const mockNames = [
                "CU 서울시청점", "GS25 광화문점", "세븐일레븐 종로3가점", "이마트24 명동점", 
                "행복나눔 슈퍼", "중앙유통 매점", "한강 마트", "강남역 봉투판매점", 
                "홍대입구역 24시 편의점", "신촌 유통센터", "여의도 중앙 슈퍼", "잠실 타워 마트"
            ];
            
            const mockAddresses = [
                "서울특별시 중구 세종대로 110", "서울특별시 종로구 종로 1", "서울특별시 중구 명동길 12",
                "서울특별시 마포구 양화로 160", "서울특별시 서초구 강남대로 390", "서울특별시 영등포구 여의대로 56",
                "서울특별시 송파구 올림픽로 300", "서울특별시 용산구 이태원로 180"
            ];

            const mockData = [];
            for (let i = 0; i < 60; i++) {
                const nameIndex = i % mockNames.length;
                const addrIndex = i % mockAddresses.length;
                
                // 서울/경기 일대 좌표
                const lat = 37.48 + (Math.random() * 0.18);
                const lng = 126.88 + (Math.random() * 0.28);

                mockData.push({
                    id: i,
                    name: `${mockNames[nameIndex]} (${i + 1}호점)`,
                    address: `${mockAddresses[addrIndex]} 부근 ${i + 1}번지`,
                    phone: `02-${Math.floor(1000 + Math.random() * 9000)}-${Math.floor(1000 + Math.random() * 9000)}`,
                    lat: lat,
                    lng: lng,
                    raw: {}
                });
            }
            return mockData;
        }

        // 5. 지역 필터 옵션 생성
        function populateRegionFilter(data) {
            const regionSelect = document.getElementById('regionFilter');
            regionSelect.innerHTML = '<option value="">전체 지역 (시/도/구)</option>';

            const regions = new Set();
            data.forEach(item => {
                if (item.address && item.address !== '주소 정보 없음') {
                    const parts = item.address.split(' ');
                    if (parts.length >= 2) {
                        regions.add(`${parts[0]} ${parts[1]}`);
                    } else if (parts.length === 1) {
                        regions.add(parts[0]);
                    }
                }
            });

            Array.from(regions).sort().forEach(region => {
                const option = document.createElement('option');
                option.value = region;
                option.textContent = region;
                regionSelect.appendChild(option);
            });
        }

        // 6. 검색 및 필터링 적용
        function applyFilters() {
            const searchKeyword = document.getElementById('searchInput').value.trim().toLowerCase();
            const selectedRegion = document.getElementById('regionFilter').value;

            filteredData = rawData.filter(item => {
                const matchesSearch = item.name.toLowerCase().includes(searchKeyword) || 
                                      item.address.toLowerCase().includes(searchKeyword);
                const matchesRegion = selectedRegion === "" || item.address.startsWith(selectedRegion);
                return matchesSearch && matchesRegion;
            });

            updateMapAndList(filteredData);
        }

        // 7. 지도 마커 및 리스트 업데이트
        function updateMapAndList(items) {
            // 마커 및 리스트 클리어
            markerClusterGroup.clearLayers();
            markerMap.clear();

            const listContainer = document.getElementById('locationList');
            listContainer.innerHTML = '';

            document.getElementById('dataCountBadge').textContent = `${items.length}개 조회됨`;

            if (items.length === 0) {
                listContainer.innerHTML = `
                    <div class="flex flex-col items-center justify-center h-48 text-slate-400 text-center">
                        <i class="fa-solid fa-circle-exclamation text-3xl mb-2 text-slate-300"></i>
                        <p class="text-sm font-medium">검색 결과가 없습니다.</p>
                        <p class="text-xs text-slate-400 mt-1">다른 검색어나 필터를 선택해 보세요.</p>
                    </div>
                `;
                return;
            }

            const bounds = L.latLngBounds();

            // 마커 아이콘 정의
            const customIcon = L.divIcon({
                className: 'custom-div-icon',
                html: `<div class="bg-indigo-600 text-white rounded-full w-8 h-8 flex items-center justify-center border-2 border-white shadow-md hover:scale-110 transition-transform">
                        <i class="fa-solid fa-location-dot text-sm"></i>
                       </div>`,
                iconSize: [32, 32],
                iconAnchor: [16, 32],
                popupAnchor: [0, -32]
            });

            items.forEach(item => {
                // 마커 생성 및 클러스터 추가
                const marker = L.marker([item.lat, item.lng], { icon: customIcon });

                // 팝업 콘텐츠 HTML
                const popupContent = `
                    <div class="p-4 max-w-xs">
                        <div class="flex items-center gap-1.5 mb-1 text-indigo-600 font-semibold text-xs">
                            <i class="fa-solid fa-store"></i> 지정 판매점 / 시설
                        </div>
                        <h3 class="font-bold text-base text-slate-900 mb-2 leading-snug">${item.name}</h3>
                        <div class="space-y-1.5 text-xs text-slate-600">
                            <p class="flex items-start gap-1.5">
                                <i class="fa-solid fa-location-dot text-slate-400 mt-0.5"></i>
                                <span>${item.address}</span>
                            </p>
                            <p class="flex items-center gap-1.5">
                                <i class="fa-solid fa-phone text-slate-400"></i>
                                <span>${item.phone}</span>
                            </p>
                        </div>
                        <div class="mt-3 pt-2 border-t border-slate-100 flex gap-2">
                            <a href="https://map.kakao.com/link/search/${encodeURIComponent(item.address || item.name)}" target="_blank" 
                               class="flex-1 bg-amber-400 hover:bg-amber-500 text-amber-950 font-medium py-1.5 px-2 rounded text-center text-xs transition-colors flex items-center justify-center gap-1">
                                <i class="fa-solid fa-map"></i> 길찾기
                            </a>
                        </div>
                    </div>
                `;

                marker.bindPopup(popupContent);
                markerClusterGroup.addLayer(marker);
                markerMap.set(item.id, marker);
                bounds.extend([item.lat, item.lng]);

                // 사이드바 리스트 아이템 엘리먼트 생성
                const listItem = document.createElement('div');
                listItem.className = 'bg-white p-3.5 rounded-xl border border-slate-200 hover:border-indigo-400 hover:shadow-md transition-all cursor-pointer group';
                listItem.onclick = () => focusLocation(item.id, item.lat, item.lng);

                listItem.innerHTML = `
                    <div class="flex justify-between items-start mb-1">
                        <h4 class="font-semibold text-sm text-slate-800 group-hover:text-indigo-600 transition-colors">${item.name}</h4>
                    </div>
                    <p class="text-xs text-slate-500 mb-1.5 line-clamp-1">
                        <i class="fa-solid fa-location-dot text-slate-400 mr-1"></i>${item.address}
                    </p>
                    <p class="text-xs text-slate-400">
                        <i class="fa-solid fa-phone mr-1"></i>${item.phone}
                    </p>
                `;
                listContainer.appendChild(listItem);
            });

            // 지도 영역 자동 조율 (데이터가 1개 이상일 경우)
            if (items.length > 0 && bounds.isValid()) {
                map.fitBounds(bounds, { padding: [50, 50], maxZoom: 15 });
            }
        }

        // 8. 리스트 클릭 시 지도 이동 및 팝업 표시
        function focusLocation(id, lat, lng) {
            map.setView([lat, lng], 16, { animate: true });
            const marker = markerMap.get(id);
            if (marker) {
                // 클러스터에 숨겨져 있다면 펼침
                markerClusterGroup.zoomToShowLayer(marker, () => {
                    marker.openPopup();
                });
            }
        }

        // 9. 사용자 위치 기반 지도 이동
        function moveToUserLocation() {
            if (!navigator.geolocation) {
                alert("브라우저가 위치 정보를 지원하지 않습니다.");
                return;
            }

            navigator.geolocation.getCurrentPosition(
                (position) => {
                    const { latitude, longitude } = position.coords;
                    map.setView([latitude, longitude], 15);
                    
                    L.circle([latitude, longitude], {
                        color: '#4f46e5',
                        fillColor: '#818cf8',
                        fillOpacity: 0.3,
                        radius: 200
                    }).addTo(map).bindPopup("현재 사용자의 위치입니다.").openPopup();
                },
                () => {
                    alert("위치 정보를 가져올 수 없습니다. 위치 권한을 확인해주세요.");
                }
            );
        }

        // 10. 지도 뷰 리셋
        function resetMapView() {
            if (filteredData.length > 0) {
                const bounds = L.latLngBounds(filteredData.map(d => [d.lat, d.lng]));
                if (bounds.isValid()) {
                    map.fitBounds(bounds, { padding: [50, 50] });
                    return;
                }
            }
            map.setView(DEFAULT_CENTER, DEFAULT_ZOOM);
        }

        // 11. 상태 바 문구 설정
        function updateStatus(message, state) {
            const statusText = document.getElementById('statusText');
            const statusBanner = document.getElementById('statusBanner');
            statusText.textContent = message;

            if (state === 'loading') {
                statusBanner.className = "bg-blue-50 border-b border-blue-200 px-4 py-2 text-xs text-blue-800 flex items-center justify-between";
            } else if (state === 'success') {
                statusBanner.className = "bg-emerald-50 border-b border-emerald-200 px-4 py-2 text-xs text-emerald-800 flex items-center justify-between";
            } else if (state === 'fallback') {
                statusBanner.className = "bg-amber-50 border-b border-amber-200 px-4 py-2 text-xs text-amber-800 flex items-center justify-between";
            }
        }

        // 12. 이벤트 리스너 등록
        function setupEventListeners() {
            const searchInput = document.getElementById('searchInput');
            const clearSearchBtn = document.getElementById('clearSearchBtn');

            searchInput.addEventListener('input', (e) => {
                if (e.target.value.length > 0) {
                    clearSearchBtn.classList.remove('hidden');
                } else {
                    clearSearchBtn.classList.add('hidden');
                }
                applyFilters();
            });

            clearSearchBtn.addEventListener('click', () => {
                searchInput.value = '';
                clearSearchBtn.classList.add('hidden');
                applyFilters();
            });

            document.getElementById('regionFilter').addEventListener('change', applyFilters);
        }
    </script>
</body>
</html>
